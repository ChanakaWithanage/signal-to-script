name: Verify Pine Script v6
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-pine-v6.py
      - run: python scripts/check-adsense.py
      - run: python scripts/check-cache-headers.py
      - run: python scripts/check-seo.py
      - run: python scripts/check-download-flow.py
      - run: node --check public/site.js
      - run: node --check public/join.js
      - run: node --check functions/_lib/download-access.js
      - run: node --check functions/api/download.js
      - run: node --check functions/scripts/_middleware.js
      - run: node --check functions/api/join.js
      - run: node --check functions/api/access.js
      - run: node --check functions/api/logout.js
      - run: node --check functions/api/google-login.js
      - run: node --check functions/_lib/google-verify.mjs
      - run: node scripts/test-google-auth.mjs
      - run: node scripts/test-guest-access.mjs
